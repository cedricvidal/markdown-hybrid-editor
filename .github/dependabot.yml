version: 2
updates:
  # CodeMirror and Lezer move as one set — a dozen separate PRs for what is
  # really one upgrade is noise, and they are only ever tested together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      dev:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
